<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Campaigner - Playable Board Mockup</title>
  <style>
    :root {
      --gold: #ffc83d;
      --orange: #ff8b1f;
      --pink: #ff4fa3;
      --blue: #37b8ff;
      --green: #62e266;
      --purple: #9b55ff;
      --paper: #fff2cf;
      --ink: #160f0c;
      --panel: rgba(13, 10, 12, .93);
      --stroke: #0b0706;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 200, 61, .15), transparent 30%),
        linear-gradient(135deg, #071420, #251024 52%, #0a1718);
      color: var(--paper);
      font-family: "Trebuchet MS", Arial, sans-serif;
      overflow: hidden;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .stage-shell {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 10px;
    }

    .stage {
      position: relative;
      width: min(100vw - 20px, calc((100vh - 20px) * 1672 / 941));
      aspect-ratio: 1672 / 941;
      background-image: url("assets/campaigner-board.png?v=2");
      background-size: cover;
      background-position: center;
      border: 3px solid #050505;
      box-shadow:
        0 18px 70px rgba(0, 0, 0, .62),
        inset 0 0 0 2px rgba(255, 200, 61, .72);
      overflow: hidden;
      isolation: isolate;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 48% 54%, transparent 0 22%, rgba(0,0,0,.08) 64%, rgba(0,0,0,.26) 100%),
        linear-gradient(180deg, rgba(255,255,255,.04), transparent 22%, transparent 72%, rgba(0,0,0,.08));
      z-index: 1;
    }

    .hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      width: var(--w);
      height: var(--h);
      border-radius: 16px;
      background: rgba(255, 200, 61, .01);
      z-index: 8;
      outline: 0;
    }

    .hotspot::before {
      content: "";
      position: absolute;
      inset: -5px;
      border: 3px solid rgba(255, 200, 61, 0);
      border-radius: 18px;
      box-shadow: 0 0 0 rgba(255, 200, 61, 0);
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .hotspot:hover::before,
    .hotspot:focus-visible::before,
    .hotspot.active::before {
      border-color: rgba(255, 200, 61, .96);
      box-shadow: 0 0 24px rgba(255, 200, 61, .8);
      background: rgba(255, 200, 61, .1);
    }

    .hotspot::after {
      content: attr(aria-label);
      position: absolute;
      left: 50%;
      top: -22px;
      transform: translate(-50%, -100%) rotate(-2deg);
      min-width: max-content;
      max-width: 220px;
      padding: 7px 10px;
      border: 3px solid var(--stroke);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      font-weight: 900;
      font-size: clamp(11px, 1.05vw, 15px);
      line-height: 1;
      text-transform: uppercase;
      box-shadow: 5px 6px 0 rgba(0,0,0,.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s ease, transform .12s ease;
    }

    .hotspot:hover::after,
    .hotspot:focus-visible::after {
      opacity: 1;
      transform: translate(-50%, -110%) rotate(-2deg);
    }

    .avatar {
      position: absolute;
      left: 44%;
      top: 56%;
      width: 5.5%;
      aspect-ratio: 156 / 259;
      /* anchor the element's BOTTOM (her feet) on the road point so she stands
         on the ground instead of floating above it. */
      transform: translate(-50%, -100%);
      z-index: 10;
      pointer-events: none;
      /* left/top are driven frame-by-frame by the path walker, so they are
         intentionally NOT transitioned here (only cosmetic props are). */
      transition:
        width .25s ease,
        filter .25s ease;
      /* No drop-shadow: it shadows her whole silhouette and never sits under
         the feet. Grounding is done with a flat oval contact shadow below. */
      will-change: left, top;
    }

    /* Flat ground/contact shadow oval directly under her feet (the element's
       bottom edge = her feet via translate -100%). Sits BEHIND the sprite. */
    .avatar::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -0.4%;
      width: 46%;
      height: 7%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center,
        rgba(0, 0, 0, .42) 0%, rgba(0, 0, 0, .28) 45%, rgba(0, 0, 0, 0) 72%);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
    }

    .avatar.moving {
      filter: saturate(1.06);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #avatarFlip {
      width: 100%;
      height: 100%;
      transition: transform 0.18s ease;
    }

    #avatarFlip.face-left {
      transform: scaleX(-1);
    }

    #avatarAnim {
      width: 100%;
      height: 100%;
      transform-origin: center bottom;
    }

    /* The idle/walk sprites are real frame animations (animated PNG), so the
       CSS bob/lean is disabled to avoid doubling up the motion. */
    #avatarAnim.idle {
      animation: none;
    }

    #avatarAnim.walking {
      animation: none;
    }

    @keyframes idleFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%       { transform: translateY(-0.35vw) rotate(0.6deg); }
    }

    /* A gentle step-bounce + alternating lean reads as a walk/waddle. */
    @keyframes walkCycle {
      0%   { transform: translateY(0)       rotate(-1.6deg); }
      25%  { transform: translateY(-0.5vw)  rotate(0deg); }
      50%  { transform: translateY(0)       rotate(1.6deg); }
      75%  { transform: translateY(-0.5vw)  rotate(0deg); }
      100% { transform: translateY(0)       rotate(-1.6deg); }
    }

    .route-dot {
      position: absolute;
      left: 44%;
      top: 56%;
      width: 2.2%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #fff9b8 0 26%, var(--gold) 27% 55%, #14100c 56%);
      box-shadow: 0 0 20px rgba(255, 200, 61, .95);
      z-index: 9;
      pointer-events: none;
      opacity: 0;
      transition: left .25s ease, top .25s ease, opacity .2s ease;
    }

    .route-dot.show {
      opacity: .9;
      animation: destPulse 1s ease-in-out infinite;
    }

    @keyframes destPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.35); }
    }

    .travel-label {
      position: absolute;
      /* pinned at top-centre of the board, no longer riding on the avatar's head */
      left: 50%;
      top: 4%;
      z-index: 12;
      transform: translate(-50%, 0) rotate(-2deg);
      padding: .48vw .72vw;
      min-width: max-content;
      border: .18vw solid var(--stroke);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      font-size: clamp(11px, .92vw, 16px);
      font-weight: 900;
      box-shadow: .35vw .42vw 0 rgba(0, 0, 0, .35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease;
    }

    .travel-label.show { opacity: 1; }

    .live-strip {
      position: absolute;
      left: 21.2%;
      bottom: 1.3%;
      width: 42.2%;
      min-height: 7.2%;
      z-index: 15;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: .55vw;
      align-items: center;
      padding: .6vw .75vw;
      background: rgba(7, 6, 7, .82);
      border: .24vw solid #050505;
      border-radius: .45vw;
      box-shadow: inset 0 0 0 .12vw rgba(255, 200, 61, .75);
    }

    .metric {
      text-align: center;
      font-weight: 900;
      text-transform: uppercase;
      color: #fff;
      line-height: 1;
      font-size: clamp(9px, .8vw, 13px);
    }

    .metric strong {
      display: block;
      margin-top: .18vw;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(17px, 1.6vw, 28px);
      color: var(--gold);
      text-shadow: .12vw .12vw 0 #000;
    }

    .metric.money strong { color: var(--green); }
    .metric.energy strong { color: var(--gold); }
    .metric.social strong { color: var(--pink); }
    .metric.ambition strong { color: var(--blue); }
    .metric.chaos strong { color: var(--purple); }

    .drawer {
      position: absolute;
      right: 2.1%;
      bottom: 15.6%;
      width: 24.8%;
      max-height: 48%;
      z-index: 22;
      padding: 1vw;
      background: var(--panel);
      border: .28vw solid #050505;
      border-radius: .7vw;
      box-shadow:
        inset 0 0 0 .12vw rgba(255, 200, 61, .75),
        .7vw .9vw 0 rgba(0,0,0,.4);
      transform: translateY(1vw);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .drawer.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .drawer h2 {
      margin: 0;
      font-family: Impact, "Arial Black", sans-serif;
      color: var(--gold);
      text-transform: uppercase;
      line-height: .95;
      font-size: clamp(21px, 2vw, 34px);
      text-shadow: .14vw .14vw 0 #000;
    }

    .drawer p {
      margin: .55vw 0 .8vw;
      color: var(--paper);
      font-weight: 800;
      font-size: clamp(12px, .9vw, 15px);
      line-height: 1.25;
    }

    .actions {
      display: grid;
      gap: .48vw;
    }

    .action {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: .7vw;
      padding: .58vw .65vw;
      background: var(--paper);
      color: var(--ink);
      border: .18vw solid #050505;
      border-radius: .45vw;
      text-align: left;
      box-shadow: 0 .25vw 0 rgba(0,0,0,.42);
      transition: transform .12s ease, background .12s ease;
    }

    .action:hover {
      transform: translateY(-.16vw);
      background: #ffe19b;
    }

    .action b {
      display: block;
      font-size: clamp(12px, .9vw, 16px);
      line-height: 1.05;
    }

    .action span {
      display: block;
      margin-top: .14vw;
      color: #6d3915;
      font-weight: 900;
      font-size: clamp(10px, .75vw, 13px);
      line-height: 1.08;
    }

    .cost {
      padding: .34vw .46vw;
      border-radius: .35vw;
      color: #fff;
      background: #15100d;
      white-space: nowrap;
      font-size: clamp(10px, .75vw, 13px);
      font-weight: 900;
    }

    .toast-stack {
      position: absolute;
      left: 20.2%;
      top: 2.3%;
      z-index: 25;
      display: grid;
      gap: .55vw;
      pointer-events: none;
    }

    .toast {
      max-width: 27vw;
      padding: .62vw .8vw;
      border: .18vw solid var(--stroke);
      border-radius: 999px;
      background: var(--paper);
      color: var(--ink);
      font-size: clamp(11px, .9vw, 16px);
      font-weight: 900;
      box-shadow: .45vw .5vw 0 rgba(0,0,0,.38);
      transform: rotate(-2deg);
      animation: toastLife 3s ease forwards;
    }

    @keyframes toastLife {
      0% { opacity: 0; transform: translateY(-.7vw) rotate(-2deg); }
      10%, 83% { opacity: 1; transform: translateY(0) rotate(-2deg); }
      100% { opacity: 0; transform: translateY(-.7vw) rotate(-2deg); }
    }

    .menu-pop {
      position: absolute;
      right: 3.2%;
      bottom: 4.6%;
      z-index: 24;
      width: 22%;
      padding: 1vw;
      background: rgba(13, 10, 12, .96);
      border: .25vw solid #050505;
      border-radius: .7vw;
      box-shadow: inset 0 0 0 .12vw rgba(255, 200, 61, .72), .7vw .85vw 0 rgba(0,0,0,.42);
      display: none;
    }

    .menu-pop.open { display: block; }

    .menu-pop h2 {
      margin: 0 0 .55vw;
      color: var(--gold);
      font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(22px, 2vw, 32px);
      text-transform: uppercase;
    }

    .menu-pop button {
      width: 100%;
      margin-top: .45vw;
      padding: .7vw;
      border: .18vw solid #050505;
      border-radius: .45vw;
      background: linear-gradient(135deg, #1c93d8, #17446c);
      color: white;
      font-weight: 900;
      text-transform: uppercase;
      box-shadow: 0 .28vw 0 rgba(0,0,0,.42);
    }

    .invisible-control {
      position: absolute;
      z-index: 18;
      background: rgba(255, 255, 255, .01);
      border-radius: .5vw;
    }

    .invisible-control:hover,
    .invisible-control:focus-visible {
      outline: .2vw solid rgba(255, 200, 61, .88);
      outline-offset: .18vw;
    }

    .stats-control {
      left: 69.6%;
      bottom: 1.4%;
      width: 13.8%;
      height: 6.8%;
    }

    .menu-control {
      left: 84.4%;
      bottom: 1.4%;
      width: 13.9%;
      height: 6.8%;
    }

    .end-turn {
      left: 1.5%;
      bottom: 1.7%;
      width: 16.5%;
      height: 13.4%;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.68);
    }

    .modal.open { display: grid; }

    .modal-card {
      width: min(760px, 88vw);
      padding: 24px;
      border: 5px solid #050505;
      border-radius: 12px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 14px 18px 0 rgba(0,0,0,.45);
    }

    .modal-card h2 {
      margin: 0 0 12px;
      color: #d95d16;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 42px;
      line-height: 1;
      text-transform: uppercase;
    }

    .modal-card p {
      font-weight: 800;
      line-height: 1.35;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .modal-stat {
      padding: 12px;
      border: 3px solid #050505;
      border-radius: 8px;
      background: #15100d;
      color: var(--paper);
      text-align: center;
      font-weight: 900;
      text-transform: uppercase;
    }

    .modal-stat strong {
      display: block;
      margin-top: 4px;
      color: var(--gold);
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 30px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .modal-actions button {
      padding: 12px 16px;
      border: 4px solid #050505;
      border-radius: 8px;
      background: linear-gradient(135deg, #148ed9, #184978);
      color: white;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 21px;
      text-transform: uppercase;
    }

    .modal-actions .secondary {
      background: linear-gradient(135deg, #a735c7, #552071);
    }

    @media (max-aspect-ratio: 1/1) {
      html, body { overflow: auto; }
      .stage-shell {
        min-width: 980px;
        align-items: start;
      }
      .stage {
        width: 960px;
      }
    }
  </style>
</head>
<body>
  <main class="stage-shell">
    <section class="stage" id="stage" aria-label="The Campaigner playable board">
      <div class="toast-stack" id="toastStack" aria-live="polite"></div>
      <div class="route-dot" id="routeDot"></div>
      <div class="avatar" id="avatar" aria-hidden="true">
        <div id="avatarFlip">
          <div id="avatarAnim">
            <img id="avatarImg" src="assets/campaigner-idle.png?v=3" alt="" />
          </div>
        </div>
      </div>
      <div class="travel-label" id="travelLabel">Click a building</div>
      <div class="live-strip" aria-label="Live player state">
        <div class="metric money">Money<strong id="moneyValue">$428</strong></div>
        <div class="metric energy">Energy<strong id="energyValue">7</strong></div>
        <div class="metric social">Social<strong id="socialValue">8</strong></div>
        <div class="metric ambition">Ambition<strong id="ambitionValue">6</strong></div>
        <div class="metric chaos">Chaos<strong id="chaosValue">7</strong></div>
      </div>

      <button class="invisible-control end-turn" id="endTurnButton" aria-label="End turn"></button>
      <button class="invisible-control stats-control" id="statsButton" aria-label="View stats"></button>
      <button class="invisible-control menu-control" id="menuButton" aria-label="Open menu"></button>

      <section class="drawer" id="drawer" aria-live="polite">
        <h2 id="drawerTitle">Building</h2>
        <p id="drawerText">Choose an action.</p>
        <div class="actions" id="actions"></div>
      </section>

      <section class="menu-pop" id="menuPop">
        <h2>Menu</h2>
        <button id="resetButton">Restart Demo</button>
        <button id="hideMenuButton">Close</button>
      </section>
    </section>
  </main>

  <section class="modal" id="statsModal" aria-modal="true" role="dialog">
    <div class="modal-card">
      <h2>Campaigner Status</h2>
      <p>Move around the board by clicking buildings. Travel and actions spend hours. The demo objective is to reach Main Character Mansion with at least $250, 8 Energy, and 8 Social.</p>
      <div class="modal-grid" id="modalGrid"></div>
      <div class="modal-actions">
        <button id="closeStatsButton">Back to Board</button>
        <button class="secondary" id="modalEndTurnButton">End Turn</button>
      </div>
    </div>
  </section>

  <script>
    const initialState = {
      money: 428,
      hours: 10,
      turn: 7,
      maxTurns: 20,
      location: "center",
      objectiveDone: false,
      stats: { energy: 7, social: 8, ambition: 6, chaos: 7 }
    };

    const state = structuredClone(initialState);

    const buildings = [
      {
        id: "academy",
        name: "Overthinking Academy",
        x: 31.2,
        y: 17.3,
        token: [36.0, 32.0],
        size: [12.8, 13.8],
        text: "Turn spirals into strategy, quizzes, and a suspicious number of diagrams.",
        actions: [
          ["Take the quiz again", "Ambition +2, Chaos +1", 2, { ambition: 2, chaos: 1 }],
          ["Build a plan wall", "Ambition +3, Energy -1", 3, { ambition: 3, energy: -1 }],
          ["Ask one useful question", "Social +1, Ambition +1", 1, { social: 1, ambition: 1 }]
        ]
      },
      {
        id: "club",
        name: "Bad Decisions Club",
        x: 45.3,
        y: 17.1,
        token: [47.6, 31.5],
        size: [12.6, 13.4],
        text: "Loud music, heroic mistakes, and the kind of story that grows in the retelling.",
        actions: [
          ["Say yes too fast", "Chaos +3, Energy -1", 2, { chaos: 3, energy: -1 }],
          ["Network in line", "Social +2, Chaos +1", 2, { social: 2, chaos: 1 }],
          ["Leave before midnight", "Energy +1", 1, { energy: 1 }]
        ]
      },
      {
        id: "mansion",
        name: "Main Character Mansion",
        x: 61.0,
        y: 18.0,
        token: [61.7, 34.6],
        size: [15.2, 13.6],
        text: "The objective. Make a dramatic entrance without going broke or spiraling.",
        actions: [
          ["Make the grand entrance", "Check objective", 2, { objective: true }],
          ["Practice being seen", "Social +1, Energy +1", 1, { social: 1, energy: 1 }],
          ["Host a tiny salon", "Social +2, Money -40", 2, { social: 2, money: -40 }]
        ]
      },
      {
        id: "mall",
        name: "Impulse Pass Mall",
        x: 74.4,
        y: 29.7,
        token: [72.1, 42.0],
        size: [13.2, 18.2],
        text: "Buy now, cry later. The escalator is somehow judging you.",
        actions: [
          ["Buy a sparkle kit", "Social +2, Money -55", 1, { social: 2, money: -55 }],
          ["Buy productivity stickers", "Ambition +2, Money -45", 1, { ambition: 2, money: -45 }],
          ["Window shop dramatically", "Chaos +1", 1, { chaos: 1 }]
        ]
      },
      {
        id: "bank",
        name: "Student Debt Bank",
        x: 63.0,
        y: 43.3,
        token: [61.6, 52.6],
        size: [12.2, 14.0],
        text: "Financial advice delivered by a haunted calculator.",
        actions: [
          ["Freelance sprint", "Money +85, Energy -2", 3, { money: 85, energy: -2 }],
          ["Negotiate fees", "Money +45, Ambition +1", 2, { money: 45, ambition: 1 }],
          ["Pay a bill early", "Money -35, Chaos -2", 1, { money: -35, chaos: -2 }]
        ]
      },
      {
        id: "pets",
        name: "Paw and Order Pet Store",
        x: 76.6,
        y: 57.6,
        token: [70.5, 62.6],
        size: [14.2, 16.8],
        text: "Therapy animals, tiny accessories, and emotional damages.",
        actions: [
          ["Pet every animal", "Energy +3, Social +1", 2, { energy: 3, social: 1 }],
          ["Adopt chaos in a scarf", "Chaos +2, Money -60", 1, { chaos: 2, money: -60 }],
          ["Volunteer shift", "Social +2, Money +20", 2, { social: 2, money: 20 }]
        ]
      },
      {
        id: "exchange",
        name: "Corporate Soul Exchange",
        x: 62.2,
        y: 68.2,
        token: [60.4, 68.7],
        size: [11.2, 14.0],
        text: "Your soul? Their KPI. A clean trade if you squint.",
        actions: [
          ["Accept a weird contract", "Money +120, Chaos +2", 4, { money: 120, chaos: 2 }],
          ["Optimize the vibe", "Ambition +2, Social -1", 2, { ambition: 2, social: -1 }],
          ["Quiet quit for lunch", "Energy +2", 1, { energy: 2 }]
        ]
      },
      {
        id: "gym",
        name: "Identity Crisis Gym",
        x: 73.5,
        y: 80.2,
        token: [67.0, 75.6],
        size: [13.6, 13.4],
        text: "New you? Maybe. Old you still has the locker key.",
        actions: [
          ["Do one heroic set", "Energy +2, Ambition +1", 2, { energy: 2, ambition: 1 }],
          ["Compare yourself badly", "Ambition -1, Chaos +2", 1, { ambition: -1, chaos: 2 }],
          ["Stretch and forgive", "Energy +1, Chaos -1", 1, { energy: 1, chaos: -1 }]
        ]
      },
      {
        id: "apartments",
        name: "Basic Apartments",
        x: 50.5,
        y: 78.1,
        token: [50.0, 70.3],
        size: [12.2, 14.5],
        text: "Dreams on hold. Mold included. Cozy enough to recover.",
        actions: [
          ["Take a real nap", "Energy +3, Chaos -1", 2, { energy: 3, chaos: -1 }],
          ["Make a list then ignore it", "Ambition +1, Chaos +1", 1, { ambition: 1, chaos: 1 }],
          ["Cook something cheap", "Money +15, Energy +1", 1, { money: 15, energy: 1 }]
        ]
      },
      {
        id: "burger",
        name: "Regret Burger",
        x: 32.3,
        y: 79.0,
        token: [38.7, 68.2],
        size: [12.4, 15.5],
        text: "Cheap, fast, regret. Extra sauce of shame.",
        actions: [
          ["Order the usual mistake", "Energy +2, Money -18, Chaos +1", 1, { energy: 2, money: -18, chaos: 1 }],
          ["Work the lunch rush", "Money +55, Energy -1", 2, { money: 55, energy: -1 }],
          ["Start a booth debate", "Social +1, Chaos +2", 1, { social: 1, chaos: 2 }]
        ]
      },
      {
        id: "temple",
        name: "Inner Peace Maybe Temple",
        x: 27.0,
        y: 56.1,
        token: [33.6, 54.8],
        size: [12.0, 13.0],
        text: "Namaste? Nah, mate. But the fountain is trying its best.",
        actions: [
          ["Try meditating badly", "Chaos -2, Energy +1", 1, { chaos: -2, energy: 1 }],
          ["Ask for guidance", "Ambition +1, Social +1", 2, { ambition: 1, social: 1 }],
          ["Light a tiny candle", "Chaos -1", 1, { chaos: -1 }]
        ]
      },
      {
        id: "market",
        name: "Friendship Market",
        x: 23.8,
        y: 34.7,
        token: [32.7, 43.4],
        size: [12.8, 13.8],
        text: "Support local legends. Besties sold separately.",
        actions: [
          ["Buy snacks for everyone", "Social +3, Money -35", 2, { social: 3, money: -35 }],
          ["Help a vendor", "Social +2, Money +25", 2, { social: 2, money: 25 }],
          ["Collect local rumors", "Chaos +1, Ambition +1", 1, { chaos: 1, ambition: 1 }]
        ]
      }
    ];

    const events = [
      ["You turned brunch into a side quest.", { chaos: 2 }],
      ["A stranger loved your idea and asked for a pitch deck.", { ambition: 1, energy: -1 }],
      ["Your group chat became a summit with snacks.", { social: 2 }],
      ["You reorganized life around one vibe and a coffee.", { energy: 1, chaos: 1 }],
      ["You almost bought a tiny hat for no reason.", { money: -25, social: 1 }]
    ];

    const stage = document.getElementById("stage");
    const avatar = document.getElementById("avatar");
    const avatarFlip = document.getElementById("avatarFlip");
    const avatarAnim = document.getElementById("avatarAnim");
    const avatarImg = document.getElementById("avatarImg");

    // Animated sprites: campaigner-idle.png (standing breathing loop) and
    // campaigner-walk.png (walk cycle), both animated PNG with transparency.
    // setSprite() swaps between them; each plays its own frame loop.
    const IDLE_SPRITE = "assets/campaigner-idle.png?v=3";
    const WALK_SPRITE = "assets/campaigner-walk.png?v=3";
    let walkSpriteReady = false;
    (function preloadWalkSprite() {
      const probe = new Image();
      probe.onload = () => { walkSpriteReady = true; };
      probe.onerror = () => { walkSpriteReady = false; };
      probe.src = WALK_SPRITE;
    })();
    function setSprite(walking) {
      const want = (walking && walkSpriteReady) ? WALK_SPRITE : IDLE_SPRITE;
      if (!avatarImg.src.endsWith(want)) avatarImg.src = want;
    }
    const routeDot = document.getElementById("routeDot");
    const travelLabel = document.getElementById("travelLabel");
    const drawer = document.getElementById("drawer");
    const actions = document.getElementById("actions");
    const menuPop = document.getElementById("menuPop");
    const START_POS = [44, 56];
    let currentTokenPos = START_POS.slice();

    function clamp(value) {
      return Math.max(0, Math.min(10, value));
    }

    // ---- Road network --------------------------------------------------
    // Waypoint graph in board-percentage coords. Each building connects to a
    // central roundabout (ring nodes rN..rNW) via a spoke road and to its
    // neighbours via the perimeter road. Walking the shortest path through
    // this graph keeps the token on real roads instead of cutting straight
    // across buildings and the fountain.
    const roadNodes = {
      rN:  [44, 33], rNE: [51, 37], rE:  [53, 43], rSE: [52, 51],
      rS:  [44, 55], rSW: [38, 51], rW:  [35, 43], rNW: [37, 36]
    };
    buildings.forEach((b) => { roadNodes[b.id] = [b.token[0], b.token[1]]; });

    const roadEdges = [
      // roundabout ring (around the fountain garden)
      ["rN", "rNE"], ["rNE", "rE"], ["rE", "rSE"], ["rSE", "rS"],
      ["rS", "rSW"], ["rSW", "rW"], ["rW", "rNW"], ["rNW", "rN"],
      // spokes: roundabout -> adjacent buildings
      ["rNW", "academy"], ["rW", "market"], ["rW", "temple"], ["rSW", "temple"],
      ["rSW", "burger"], ["rS", "apartments"], ["rN", "club"], ["rNE", "mansion"],
      ["rE", "bank"], ["rSE", "exchange"],
      // perimeter road (outer ring, angular order)
      ["academy", "club"], ["club", "mansion"], ["mansion", "mall"], ["mall", "pets"],
      ["pets", "gym"], ["gym", "exchange"], ["exchange", "apartments"],
      ["apartments", "burger"], ["burger", "temple"], ["temple", "market"],
      ["market", "academy"]
      // (removed the inner cross-connectors bank-mansion, bank-exchange,
      //  mall-mansion: they cut straight across the fountain/grass. Routing now
      //  follows the roundabout ring + spokes + perimeter, i.e. real roads.)
    ];

    // aspect-corrected length (board is 1672x941) so walk speed looks uniform
    const AR_X = 1672 / 100, AR_Y = 941 / 100;
    function segLen(a, b) {
      const dx = (a[0] - b[0]) * AR_X, dy = (a[1] - b[1]) * AR_Y;
      return Math.hypot(dx, dy);
    }

    const adj = {};
    Object.keys(roadNodes).forEach((k) => { adj[k] = []; });
    roadEdges.forEach(([a, b]) => {
      const w = segLen(roadNodes[a], roadNodes[b]);
      adj[a].push([b, w]); adj[b].push([a, w]);
    });

    function nearestNode(pos) {
      let best = null, bd = Infinity;
      for (const k in roadNodes) {
        const d = segLen(pos, roadNodes[k]);
        if (d < bd) { bd = d; best = k; }
      }
      return best;
    }

    function shortestPath(fromId, toId) {
      const dist = {}, prev = {}, seen = {};
      Object.keys(roadNodes).forEach((k) => { dist[k] = Infinity; });
      dist[fromId] = 0;
      while (true) {
        let u = null, ud = Infinity;
        for (const k in dist) if (!seen[k] && dist[k] < ud) { ud = dist[k]; u = k; }
        if (u === null || u === toId) break;
        seen[u] = true;
        for (const [v, w] of adj[u]) {
          if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
        }
      }
      const path = []; let cur = toId;
      while (cur !== undefined) { path.unshift(cur); if (cur === fromId) break; cur = prev[cur]; }
      return path[0] === fromId ? path : [fromId, toId];
    }

    // polyline of [x,y] points the token walks: from its current spot, onto
    // the road graph, to the destination building.
    function buildRoute(destId) {
      const startNode = (state.location && roadNodes[state.location])
        ? state.location : nearestNode(currentTokenPos);
      const pts = shortestPath(startNode, destId).map((n) => roadNodes[n].slice());
      const first = pts[0];
      if (Math.abs(first[0] - currentTokenPos[0]) + Math.abs(first[1] - currentTokenPos[1]) > 0.4) {
        pts.unshift(currentTokenPos.slice());
      }
      return pts;
    }

    // ---- Path walker (constant-speed motion along the polyline) ---------
    const WALK_SPEED = 560; // native px per second
    let walkRAF = null;

    function walkRoute(points, onArrive) {
      const segs = [];
      let total = 0;
      for (let i = 1; i < points.length; i++) {
        const L = segLen(points[i - 1], points[i]);
        segs.push(L); total += L;
      }
      if (total < 0.001 || points.length < 2) { setTokenPosition(points[points.length - 1][0], points[points.length - 1][1]); if (onArrive) onArrive(); return; }
      const duration = Math.max(450, (total / WALK_SPEED) * 1000);
      const t0 = performance.now();

      function frame(now) {
        const p = Math.min(1, (now - t0) / duration);
        const target = p * total;
        let acc = 0, i = 0;
        while (i < segs.length - 1 && acc + segs[i] < target) { acc += segs[i]; i++; }
        const a = points[i], b = points[i + 1];
        const segFrac = segs[i] ? Math.min(1, (target - acc) / segs[i]) : 1;
        const x = a[0] + (b[0] - a[0]) * segFrac;
        const y = a[1] + (b[1] - a[1]) * segFrac;
        if (b[0] - a[0] < -0.05) avatarFlip.classList.add("face-left");
        else if (b[0] - a[0] > 0.05) avatarFlip.classList.remove("face-left");
        setTokenPosition(x, y);
        if (p < 1) { walkRAF = requestAnimationFrame(frame); }
        else { walkRAF = null; if (onArrive) onArrive(); }
      }
      walkRAF = requestAnimationFrame(frame);
    }

    function createHotspots() {
      buildings.forEach((building) => {
        const button = document.createElement("button");
        button.className = "hotspot";
        button.dataset.id = building.id;
        button.setAttribute("aria-label", building.name);
        button.style.left = `${building.x}%`;
        button.style.top = `${building.y}%`;
        button.style.setProperty("--w", `${building.size[0]}%`);
        button.style.setProperty("--h", `${building.size[1]}%`);
        button.addEventListener("click", () => travelTo(building));
        stage.appendChild(button);
      });
    }

    function setTokenPosition(x, y) {
      avatar.style.left = `${x}%`;
      avatar.style.top = `${y}%`;
      // travel label is now pinned at top-centre via CSS; do not move it onto the avatar.
      currentTokenPos = [x, y];
    }

    function render() {
      document.getElementById("moneyValue").textContent = `$${state.money}`;
      document.getElementById("energyValue").textContent = state.stats.energy;
      document.getElementById("socialValue").textContent = state.stats.social;
      document.getElementById("ambitionValue").textContent = state.stats.ambition;
      document.getElementById("chaosValue").textContent = state.stats.chaos;
      renderModalStats();
    }

    function renderModalStats() {
      const grid = document.getElementById("modalGrid");
      grid.innerHTML = `
        <div class="modal-stat">Money<strong>$${state.money}</strong></div>
        <div class="modal-stat">Hours<strong>${state.hours}</strong></div>
        <div class="modal-stat">Energy<strong>${state.stats.energy}/10</strong></div>
        <div class="modal-stat">Social<strong>${state.stats.social}/10</strong></div>
        <div class="modal-stat">Chaos<strong>${state.stats.chaos}/10</strong></div>
      `;
    }

    function toast(message) {
      const stack = document.getElementById("toastStack");
      const item = document.createElement("div");
      item.className = "toast";
      item.textContent = message;
      stack.appendChild(item);
      window.setTimeout(() => item.remove(), 3000);
    }

    function travelTo(building) {
      if (avatar.classList.contains("moving")) return;
      if (state.location === building.id) { openDrawer(building); return; }

      const route = buildRoute(building.id);
      const origin = currentTokenPos;
      const distance = Math.abs(origin[0] - building.token[0]) + Math.abs(origin[1] - building.token[1]);
      const cost = Math.max(1, Math.ceil(distance / 18));
      if (state.hours < cost) {
        toast("Not enough hours left. Click the clock to end your turn.");
        return;
      }

      state.hours -= cost;
      drawer.classList.remove("open");
      menuPop.classList.remove("open");
      document.querySelectorAll(".hotspot").forEach((el) => el.classList.remove("active"));
      document.querySelector(`[data-id="${building.id}"]`).classList.add("active");

      // pulsing destination marker on the target building
      routeDot.style.left = `${building.token[0]}%`;
      routeDot.style.top = `${building.token[1]}%`;
      routeDot.classList.add("show");

      travelLabel.textContent = `To ${building.name}: ${cost}h`;
      travelLabel.classList.add("show");
      avatar.classList.add("moving");
      avatarAnim.classList.remove("idle");
      avatarAnim.classList.add("walking");
      setSprite(true);
      render();

      walkRoute(route, () => {
        avatar.classList.remove("moving");
        avatarAnim.classList.remove("walking");
        avatarAnim.classList.add("idle");
        setSprite(false);
        routeDot.classList.remove("show");
        state.location = building.id;
        travelLabel.textContent = `${state.hours}h left`;
        openDrawer(building);
        toast(`Arrived at ${building.name}.`);
      });
    }

    function openDrawer(building) {
      document.getElementById("drawerTitle").textContent = building.name;
      document.getElementById("drawerText").textContent = building.text;
      actions.innerHTML = "";
      building.actions.forEach(([label, note, cost, effect]) => {
        const button = document.createElement("button");
        button.className = "action";
        button.innerHTML = `<div><b>${label}</b><span>${note}</span></div><div class="cost">${cost}h</div>`;
        button.addEventListener("click", () => takeAction(label, cost, effect));
        actions.appendChild(button);
      });
      drawer.classList.add("open");
    }

    function takeAction(label, cost, effect) {
      if (state.hours < cost) {
        toast("Not enough hours. End the turn first.");
        return;
      }
      state.hours -= cost;
      applyEffect(effect);
      if (!effect.objective && Math.random() < .35) drawEvent();
      render();
      travelLabel.textContent = `${state.hours}h left`;
      toast(`${label}.`);
      if (state.hours <= 0) window.setTimeout(endTurn, 700);
    }

    function applyEffect(effect) {
      Object.entries(effect).forEach(([key, amount]) => {
        if (key === "money") state.money = Math.max(0, state.money + amount);
        else if (key === "objective") checkObjective();
        else state.stats[key] = clamp(state.stats[key] + amount);
      });
    }

    function drawEvent() {
      const [message, effect] = events[Math.floor(Math.random() * events.length)];
      applyEffect(effect);
      toast(`Life event: ${message}`);
    }

    function checkObjective() {
      const complete = state.money >= 250 && state.stats.energy >= 8 && state.stats.social >= 8;
      if (complete) {
        state.objectiveDone = true;
        state.money += 50;
        toast("Objective complete. Main character entrance secured.");
      } else {
        toast("Objective needs $250, 8 Energy, and 8 Social.");
      }
    }

    function endTurn() {
      state.turn = state.turn >= state.maxTurns ? 1 : state.turn + 1;
      state.hours = 10;
      drawer.classList.remove("open");
      menuPop.classList.remove("open");
      if (state.stats.chaos >= 9) {
        state.stats.energy = clamp(state.stats.energy - 1);
        toast("New turn. Chaos was high, so Energy drops by 1.");
      } else {
        toast("New turn. Fresh hours, questionable priorities.");
      }
      travelLabel.textContent = `${state.hours}h left`;
      travelLabel.classList.add("show");
      render();
    }

    function resetDemo() {
      if (walkRAF) { cancelAnimationFrame(walkRAF); walkRAF = null; }
      Object.assign(state, structuredClone(initialState));
      state.stats = structuredClone(initialState.stats);
      drawer.classList.remove("open");
      menuPop.classList.remove("open");
      routeDot.classList.remove("show");
      document.querySelectorAll(".hotspot").forEach((el) => el.classList.remove("active"));
      avatar.classList.remove("moving");
      setTokenPosition(START_POS[0], START_POS[1]);
      avatarFlip.classList.remove("face-left");
      avatarAnim.classList.remove("walking");
      avatarAnim.classList.add("idle");
      setSprite(false);
      travelLabel.textContent = "Click a building";
      travelLabel.classList.add("show");
      render();
      toast("Demo reset.");
    }

    document.getElementById("statsButton").addEventListener("click", () => {
      renderModalStats();
      document.getElementById("statsModal").classList.add("open");
    });

    document.getElementById("closeStatsButton").addEventListener("click", () => {
      document.getElementById("statsModal").classList.remove("open");
    });

    document.getElementById("modalEndTurnButton").addEventListener("click", () => {
      document.getElementById("statsModal").classList.remove("open");
      endTurn();
    });

    document.getElementById("endTurnButton").addEventListener("click", endTurn);
    document.getElementById("menuButton").addEventListener("click", () => menuPop.classList.toggle("open"));
    document.getElementById("hideMenuButton").addEventListener("click", () => menuPop.classList.remove("open"));
    document.getElementById("resetButton").addEventListener("click", resetDemo);

    createHotspots();
    setTokenPosition(START_POS[0], START_POS[1]);
    avatarAnim.classList.add("idle");
    render();
    window.setTimeout(() => {
      travelLabel.classList.add("show");
      toast("Click a building — your character walks the roads to get there.");
    }, 500);
  </script>
</body>
